name: C/C++ CI


on:
    pull_request:
        types: [opened, synchronize, reopened]
    push:
        branches:
            - master
    schedule:
      # Schedule to run at 00:00 UTC on the 1st of every month
      - cron: '0 0 1 * *'
    

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3
      - name: Compile
        run: |
          make all
      - name: Run tests
        run: |
          make PartA
          make PartB
          make imageloader
          make steganography
          make gameoflife
