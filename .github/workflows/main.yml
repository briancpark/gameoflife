name: C/C++ CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v2
      - name: Compile
        run: |
          make all
      - name: Run tests
        run: |
          make PartA
          make PartB
          make imageloader
          make steganography
          make gameoflife
          alias oracleOfLife="./gameOfLife"
          bash fsociety.sh